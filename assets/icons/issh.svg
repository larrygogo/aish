<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 黑底 squircle（macOS HIG 风格，rx ≈ 22%）-->
  <rect width="64" height="64" rx="14" ry="14" fill="#000000"/>

  <!-- 等边三角形：顶点朝右。
       几何中点 (Lx+Rx)/2 = (20+44)/2 = 32，左右边距严格对称。
       宽 24 / 高 ≈ 27.7（等边比例），高度近似 (Ty=18, By=46) 高 28。 -->
  <path
    d="M 20 18 L 44 32 L 20 46 Z"
    fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4"
    stroke-linejoin="round" stroke-linecap="round"
  />
</svg>
