<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- CRT 磷光辉光滤镜 -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- CRT 扫描线纹理 -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="64" height="2">
      <rect width="64" height="1" y="1" fill="#000000" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- 背景：纯黑 -->
  <rect width="64" height="64" rx="10" ry="10" fill="#000000"/>

  <!-- 主符号：">_"，像素风，终端绿 #00FF41 -->
  <g fill="#00FF41" filter="url(#bloom)">
    <!--
      ">" 箭头：5列×9行，每像素 = 3×3 SVG 单位
      起点 x=14, y=18
      行0:       col0
      行1:       col0 col1
      行2:       col0 col1 col2
      行3:       col0 col1 col2 col3
      行4:       col0 col1 col2 col3 col4  (尖端)
      行5:       col0 col1 col2 col3
      行6:       col0 col1 col2
      行7:       col0 col1
      行8:       col0
    -->
    <!-- ">" 行0 -->
    <rect x="14" y="18" width="3" height="3"/>
    <!-- ">" 行1 -->
    <rect x="14" y="21" width="3" height="3"/>
    <rect x="17" y="21" width="3" height="3"/>
    <!-- ">" 行2 -->
    <rect x="14" y="24" width="3" height="3"/>
    <rect x="17" y="24" width="3" height="3"/>
    <rect x="20" y="24" width="3" height="3"/>
    <!-- ">" 行3 -->
    <rect x="14" y="27" width="3" height="3"/>
    <rect x="17" y="27" width="3" height="3"/>
    <rect x="20" y="27" width="3" height="3"/>
    <rect x="23" y="27" width="3" height="3"/>
    <!-- ">" 行4（尖端） -->
    <rect x="14" y="30" width="3" height="3"/>
    <rect x="17" y="30" width="3" height="3"/>
    <rect x="20" y="30" width="3" height="3"/>
    <rect x="23" y="30" width="3" height="3"/>
    <rect x="26" y="30" width="3" height="3"/>
    <!-- ">" 行5 -->
    <rect x="14" y="33" width="3" height="3"/>
    <rect x="17" y="33" width="3" height="3"/>
    <rect x="20" y="33" width="3" height="3"/>
    <rect x="23" y="33" width="3" height="3"/>
    <!-- ">" 行6 -->
    <rect x="14" y="36" width="3" height="3"/>
    <rect x="17" y="36" width="3" height="3"/>
    <rect x="20" y="36" width="3" height="3"/>
    <!-- ">" 行7 -->
    <rect x="14" y="39" width="3" height="3"/>
    <rect x="17" y="39" width="3" height="3"/>
    <!-- ">" 行8 -->
    <rect x="14" y="42" width="3" height="3"/>

    <!-- "_" 光标：6列×1行，与">"底行(行8) y=42 对齐，间隔 2 格 -->
    <rect x="32" y="42" width="3" height="3"/>
    <rect x="35" y="42" width="3" height="3"/>
    <rect x="38" y="42" width="3" height="3"/>
    <rect x="41" y="42" width="3" height="3"/>
    <rect x="44" y="42" width="3" height="3"/>
    <rect x="47" y="42" width="3" height="3"/>
  </g>

  <!-- 扫描线覆盖层 -->
  <rect width="64" height="64" rx="10" ry="10" fill="url(#scanlines)"/>
</svg>
