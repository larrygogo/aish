[package]
name = "aish-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "aish 主应用（GPUI 在 M1 接入）"
include = ["src/**/*", "assets/**/*", "Cargo.toml"]

build = "build.rs"

[[bin]]
name = "aish"
path = "src/main.rs"

[dependencies]
aish-types = { workspace = true }
aish-ssh = { workspace = true }
aish-tmux = { workspace = true }
bytes = { workspace = true }
aish-sftp = { workspace = true }
aish-secrets = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
uuid = { workspace = true }
alacritty_terminal = { workspace = true }
dirs = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
arboard = { workspace = true }
image = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name              = "aish"
identifier        = "com.larrygogo.aish"
version           = "0.1.0"
copyright         = "Copyright © 2026 larry. MIT License."
category          = "Developer Tool"
short_description = "AI-powered SSH client"
icon              = ["crates/aish-app/assets/logo.svg"]
