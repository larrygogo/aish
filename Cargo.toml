[workspace]
resolver = "2"
members = [
    "crates/aish-types",
    "crates/aish-ssh",
    "crates/aish-tmux",
    "crates/aish-sftp",
    "crates/aish-secrets",
    "crates/aish-app",
    "crates/aish-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["larry"]
repository = "https://github.com/larrygogo/aish"
rust-version = "1.80"

[workspace.dependencies]
# 共享版本
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "fs"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
dirs = "5.0"
tempfile = "3.10"
toml = "0.8"
petname = { version = "3.0", default-features = false, features = ["default-rng", "default-words"] }

# 本地 crate
aish-types = { path = "crates/aish-types" }
aish-ssh = { path = "crates/aish-ssh" }
aish-tmux = { path = "crates/aish-tmux" }
aish-sftp = { path = "crates/aish-sftp" }
aish-secrets = { path = "crates/aish-secrets" }
aish-ui = { path = "crates/aish-ui" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "aa16a3bf9d579ed858490d2bd1765df6d9cef5aa" }
# gpui_platform 必须显式启用 `font-kit` feature —— 否则它的 default = []
# 导致 gpui_macos 的 `font-kit` feature 也关掉（gpui_platform 的 font-kit
# = ["gpui_macos/font-kit"]），结果 gpui_macos 内 `#[cfg(feature = "font-kit")]`
# gated 的整个 text_system 模块（CoreText/CTFont 调用全部在内）从源码里
# 消失，binary 不链接 CoreText.framework → 窗口能开但任何文字 / image /
# svg（走 sprite atlas + glyph raster 的路径）一律不渲染，只有 quad/border
# 正常。zed 自家 hello_world 默认启用 font-kit 所以能跑出文字。
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "aa16a3bf9d579ed858490d2bd1765df6d9cef5aa", features = ["font-kit"] }
russh = "0.46"
russh-keys = "0.46"
alacritty_terminal = "0.26"
russh-sftp = "2.1"
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
